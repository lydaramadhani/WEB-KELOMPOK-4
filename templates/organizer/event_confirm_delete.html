{% extends 'base.html' %}
{% block title %}Konfirmasi Hapus Event - Eventify{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="glass-card p-4 p-md-5 text-center">
        <div class="rounded-circle bg-danger bg-opacity-25 p-3 d-inline-flex mb-3">
          <i class="fa-solid fa-triangle-exclamation fs-1 text-danger"></i>
        </div>
        <h3 class="fw-bold text-white mb-2">Konfirmasi Hapus Event</h3>
        <p class="text-muted mb-4">Apakah Anda yakin ingin menghapus event <strong class="text-white">"{{ event.title }}"</strong>? Tindakan ini tidak dapat dibatalkan.</p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2 justify-content-center">
            <button type="submit" class="btn btn-danger px-4 py-2.5">
              <i class="fa-solid fa-trash me-1"></i> Yakin, Hapus Event
            </button>
            <a href="{% url 'organizer_event_list' %}" class="btn btn-outline-glass py-2.5">Batal</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
