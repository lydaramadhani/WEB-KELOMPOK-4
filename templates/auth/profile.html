{% extends 'base.html' %}
{% block title %}Profil Saya - Eventify Kelompok 4{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="glass-card p-4 p-md-5">
        <div class="d-flex align-items-center gap-3 mb-4">
          <div class="rounded-circle bg-primary bg-opacity-25 p-3 text-primary fs-3">
            <i class="fa-solid fa-id-card"></i>
          </div>
          <div>
            <h3 class="fw-bold text-white mb-0">Profil Pengguna</h3>
            <span class="badge bg-secondary bg-opacity-25 text-info">
              {% if profile.is_organizer %}Event Organizer{% else %}Peserta Event{% endif %}
            </span>
          </div>
        </div>

        <form method="post" action="{% url 'profile' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label text-muted small">Username (Tidak dapat diubah)</label>
            <input type="text" class="form-control" value="{{ user.username }}" readonly disabled>
          </div>

          <div class="mb-3">
            <label class="form-label text-light small fw-semibold">Nama Lengkap</label>
            <input type="text" name="full_name" class="form-control" value="{{ user.first_name }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-light small fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-light small fw-semibold">Nomor WhatsApp / HP</label>
            <input type="text" name="phone" class="form-control" value="{{ profile.phone }}">
          </div>

          {% if profile.is_organizer %}
            <div class="mb-4">
              <label class="form-label text-light small fw-semibold">Nama Organisasi / EO</label>
              <input type="text" name="organization_name" class="form-control" value="{{ profile.organization_name }}">
            </div>
          {% endif %}

          <div class="d-flex gap-2 pt-3">
            <button type="submit" class="btn btn-gradient">
              <i class="fa-solid fa-floppy-disk me-1"></i> Simpan Perubahan
            </button>
            <a href="{% url 'home' %}" class="btn btn-outline-glass">Kembali</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
